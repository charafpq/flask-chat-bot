
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Chatbot</title>
</head>
<style>
  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.chat-container {
  width: 100%;
  max-width: 500px;
  height: 90vh;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-header {
  background: #4f46e5;
  color: #fff;
  padding: 16px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.chat-box {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 12px;
  line-height: 1.4;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.message.user {
  align-self: flex-end;
  background: #4f46e5;
  color: #fff;
  border-bottom-right-radius: 2px;
}

.message.bot {
  align-self: flex-start;
  background: #e5e7eb;
  color: #111;
  border-bottom-left-radius: 2px;
}

.chat-input {
  display: flex;
  padding: 12px;
  border-top: 1px solid #ddd;
  gap: 8px;
}

.chat-input input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #ccc;
  border-radius: 20px;
  outline: none;
}

.chat-input input:focus {
  border-color: #4f46e5;
}

.chat-input button {
  padding: 10px 20px;
  background: #4f46e5;
  color: #fff;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

.chat-input button:hover {
  background: #4338ca;
}

.chat-input button:disabled {
  background: #a5a3d6;
  cursor: not-allowed;
}
</style>
<body>
  <div class="chat-container">
    <div class="chat-header">RAG Chatbot</div>

    <div class="chat-box" id="chat-box">
      <div class="message bot">Hi! Ask me anything about your documents.</div>
    </div>

    <form class="chat-input" id="chat-form" method="POST" action="{{url_for('send')}}">
      <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off" name="message" required>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const form = document.getElementById("chat-form");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.classList.add("message", sender);
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

async function sendMessage(event) {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  sendBtn.disabled = true;

  const loading = addMessage("Thinking...", "bot");

  try {
    const response = await fetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    const data = await response.json();
    loading.textContent = data.assistant_response || data.error || "Something went wrong.";
  } catch (error) {
    loading.textContent = "Error: could not reach the server.";
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", sendMessage);
  </script>
</body>
</html>
